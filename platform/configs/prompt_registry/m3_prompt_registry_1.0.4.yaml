    Do not emit title, text, quote, rationale, reasoning, answer, final_answer, support, source, sources, citation, citations, or any other field.

    Valid shape example:
    {"payload_type":"structured","message_status":"content","claims":[{"claim_id":"claim-1","claim_text":"A supported fact.","source_refs":[{"evidence_id":"evidence-0-0","context_ref":{"sample_id":"dataset:release:split:id","context_index":0},"granularity":"sentence","sentence_ids":[0],"reference_origin":"local_document"}]}],"summary":null}
    Before responding, verify the top level has 4 keys, every claim has 3 keys, and no object contains an unlisted key.
  initial_closed: |-
    Question: {question}

    Task: Extract only distinct atomic facts supported by the assigned documents. Do not answer or compare. For every fact, copy an exact visible Citation template and change only claim_id and claim_text. Return only the closed JSON shape required by the system message.

    Assigned documents:
    {documents}
  centralized_initial_closed: |-
    Question: {question}

    Task: Read the complete assigned-document union centrally. Extract only distinct atomic facts supported by those documents. Do not answer or compare. For every fact, copy an exact visible Citation template and change only claim_id and claim_text. Return only the closed JSON shape required by the system message.

    Assigned-document union:
    {documents}
  communication_closed: |-
    Question: {question}

    Task: Forward every distinct supported parent claim once. Use exactly the three claim keys and the permitted compact source_ref keys from the system message. Change source_ref.reference_origin to "inherited_message" and do not add any explanation or metadata.

    Visible parent messages (canonical JSON):
    {parents}
  communication_a1: |-
    Question: {question}

    Task: Forward every distinct supported parent claim once using the closed JSON shape. Parent source_refs are intentionally hidden. Do not reconstruct hidden locators; use source_refs=[] when no valid locator is visible.

    Visible parent messages (canonical JSON):
    {parents}
  communication_a2: |-
    Question: {question}

    Task: Produce a fresh closed-schema StructuredPayload containing currently supported candidate claims for the next agent.

    Visible parent messages (canonical JSON):
    {parents}
  empty_document_reminder: |-
    No documents were assigned. Return exactly {"payload_type":"structured","message_status":"no_new_information","claims":[],"summary":null}.
