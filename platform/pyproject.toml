[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-experiment-platform"
version = "0.1.0"
description = "A traceable, reproducible multi-agent research instrument."
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0,<7",
    "httpx>=0.27,<1",
]

[project.scripts]
agent-lab = "agent_lab.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
